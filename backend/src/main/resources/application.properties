spring.application.name=commander-table
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/mtgcmd}
spring.datasource.username=${DATABASE_USER:mtgcmd}
spring.datasource.password=${DATABASE_PASSWORD:mtgcmd}
spring.flyway.enabled=true
spring.jackson.serialization.order-map-entries-by-keys=true
server.address=${BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-request-size=1MB
app.origin=${PUBLIC_ORIGIN:http://127.0.0.1:5173}
app.secure-cookie=${SECURE_COOKIE:false}
