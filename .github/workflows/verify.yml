name: Project verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Check frontend lint, types, formatting, and unit tests
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run typecheck
          npm --prefix frontend run format:check
          npm --prefix frontend test
      - name: Check analyzer reporting
        run: npm --prefix frontend run test:analysis
      - name: Check build wrappers and PMD integration
        run: node --test --test-isolation=none scripts/build.test.mjs scripts/pmd.test.mjs
      - name: Check report and deployment tooling
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate specifications and dependency index
        run: python3 -B scripts/validate-specs.py
      - name: Build and verify the packaged application
        run: ./scripts/build.sh
      - name: Install browser and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Check browser flows
        run: npm --prefix frontend run test:e2e
      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            frontend/reports/static-analysis/
            frontend/playwright-report/
            frontend/test-results/
            backend/target/surefire-reports/
            backend/target/pmd.xml
            backend/target/pmd.txt
